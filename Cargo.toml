[workspace]
members = [
    "crates/yamarchy-core",
    "crates/yamarchy-player",
    "crates/yamarchy-daemon",
    "crates/yamarchy-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2021"
authors = ["Mehroj Majidov"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/mehroj-r/yamarchy"
readme = "README.md"
keywords = ["yandex-music", "music-player", "mpris", "omarchy", "linux"]

[workspace.dependencies]
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.13", features = ["json", "stream"] }
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
md-5 = "0.11"
dirs = "7.0"
toml = "1.1"
futures = "0.3"
bytes = "1.6"
rodio = { version = "0.23", default-features = false, features = ["symphonia-all"] }
symphonia = { version = "0.6", features = ["all"] }
zbus = { version = "5.19", features = ["tokio"] }
clap = { version = "4.5", features = ["derive", "env"] }
chrono = { version = "0.4", features = ["serde"] }
yamarchy-core = { path = "crates/yamarchy-core" }
yamarchy-player = { path = "crates/yamarchy-player" }
